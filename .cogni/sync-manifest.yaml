# spec.repo-sync-contract — SSOT for what is operator-scope across hub + artifacts.
#
# Inverse-manifest form: everything is shared by default; this file enumerates
# (a) global excludes that NO repo cares about, and (b) per-artifact divergences
# in two flavors — paths the artifact omits, paths the artifact adds.
#
# Validated by .cogni/sync-manifest.schema.json (check-jsonschema in ci.yaml)
# + scripts/validate-sync-manifest-refs.mjs (cross-reference checks).
# Drift surfaced by scripts/ci/detect-sync-drift.mjs + sync-drift-detector.yml.

schema: 2
hub: cogni-dao/cogni
artifacts:
  - repo: cogni-dao/standalone-node
    visibility: public
  - repo: cogni-dao/cogni-poly
    visibility: private # detector skips until v0.2 (needs PAT)

# Global excludes — never propagated to or from any artifact. Junk / caches /
# build outputs / git internals. Default-deny-divergence applies BELOW this set.
exclude:
  - ".git/**"
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - "build/**"
  - ".turbo/**"
  - "coverage/**"
  - ".playwright/**"
  - ".local-auth/**"
  - "**/*.tsbuildinfo"

# FOUNDATION — Tier 1 + Tier 2 (spec.repo-sync-contract § Three-Tier Fork Sync). This is the POSITIVE
# allowlist of the platform substrate node-template owns and syncs into every fork: the flight contract
# (Tier 1, force-overwritten) + the foundational app/runtime/library substrate (Tier 2, three-way merged).
# It is the SSOT for "what is foundation"; Tier 3 (node identity / presentation / product — the node's
# FACE and its mission) is the COMPLEMENT: everything NOT listed here. On a node-template→fork sync, the
# complement is carved OUT of the merge and RESTORED to the fork's own version — never overwritten
# ("build their mission, not their plumbing"). Sovereignty is the DEFAULT; the foundation is the allowlist.
#
# Failure-mode asymmetry decides this polarity: MISSING a path here is NON-destructive (the fork just
# misses a substrate update — staleness, drift-detectable), so err toward UNDER-claiming. The inverse
# (enumerating Tier 3) would mean a missed entry SILENTLY CLOBBERS a fork's sovereign code — destructive.
#
# This is a DIFFERENT axis from divergences[] below (hub↔artifact MIRROR drift, consumed by the
# drift-detector). `foundation` is the node-template→fork allowlist (consumed by the operator fork-sync
# at runtime). They are co-located in this one file but never share semantics — different relationships,
# opposite default polarities. The operator fork-sync reads node-template's copy of THIS list at runtime
# (FOUNDATION_IS_ENUMERATED); a node-template PR that GROWS the shared substrate adds the path here in the
# same PR. Default floor lives in
# nodes/operator/app/src/shared/node-app-scaffold/node-local-paths.ts (used when this block is absent).
foundation:
  # Tier 1 — flight contract (force-overwritten by syncCanonicalFilesToFork).
  - ".github/workflows/ci.yaml"
  - ".github/workflows/pr-build.yml"
  - ".github/workflows/pr-lint.yaml"
  - "scripts/check-node-ci-workflow.mjs"
  # Tier 2 — foundational substrate (three-way merge).
  - "app/src/app/api/**" # cognition/runtime API surface (the platform seam)
  - "app/src/shared/**" # shared application substrate (env, logging, ports wiring)
  - "app/src/bootstrap/**" # bootstrap / capability composition root
  - "graphs/**" # agent graph runtime the platform ships
  - "packages/**" # workspace libraries (knowledge-base/-store, db-schema, repo-spec, …)

# Per-artifact divergences. Two shapes:
#   omit_from_artifact: paths the hub has that the artifact intentionally lacks.
#   artifact_only:      paths the artifact has that the hub intentionally lacks.
# Anything NOT covered by exclude[] or these lists MUST match across hub + artifact.
divergences:
  - artifact: cogni-dao/standalone-node
    reason: "OSS public quickstart — omits hub-only nodes + canary env. Secrets substrate (OpenBao/ESO + catalog loader + tier spec) graduated to shared via task.5081."
    omit_from_artifact:
      # AGENTS.md exists on BOTH repos but intentionally diverges — the
      # artifact prepends a development-freeze banner (cogni-dao/standalone-node#66)
      # that must NOT appear in the hub (the hub IS the dev repo). The schema has
      # no "expected-different" category, so a both-sides intentional divergence
      # must be listed in BOTH omit_from_artifact (suppresses the hub-side 🟡
      # "different") AND artifact_only below (suppresses the resulting 🟣
      # "only-on-artifact"). See the artifact_only twin entry.
      - "AGENTS.md" # dev-freeze banner; both-list entry (see comment above)
      - "nodes/operator/**" # hub-only node
      - "infra/catalog/operator.yaml"
      - "infra/catalog/node-template.yaml" # hub-style; artifact carries standalone-style (task.5078) — both-sides intentional divergence
      - ".github/workflows/release.yml" # no production env
      - "tests/ci-invariants/**" # hub-only CI structural tests
      - "infra/k8s/secrets/production/**" # hub production secrets — never ship to public template
      - "infra/k8s/secrets/staging/**" # hub staging secrets
      - "infra/k8s/secrets/.sops.yaml" # hub sops key config
      - "infra/k8s/secrets/README.md" # hub secrets-layout doc
      - "scripts/experiments/**" # hub-only research scripts
    artifact_only:
      - "AGENTS.md" # dev-freeze banner twin (see omit_from_artifact comment) — both lists required to zero the bidirectional drift flag
      - "infra/fork.yaml"
      - "infra/k8s/overlays/_template/node-template/**"
      - "infra/catalog/node-template.yaml" # standalone-style fork catalog — see omit_from_artifact twin (both-sides divergence)
      - "infra/k8s/overlays/candidate-a/node-template/**" # hub + artifact diverge; hub overlay activates ExternalSecret via task.5081 CP2
      - "infra/k8s/overlays/preview/node-template/**"
      - "infra/k8s/overlays/production/node-template/**"
      - "scripts/dev/worktree-setup.sh"
      - "scripts/rename-node.sh"
      - "scripts/setup/bootstrap.sh" # sources lib/fork-identity.sh; hub uses lib/cogni-deployment-identity.sh — reconcile separately
      - "scripts/bootstrap/install/install-bash.sh"

  - artifact: cogni-dao/cogni-poly
    reason: "Private per-node fork; carries the poly node, omits the template node + other hub nodes."
    omit_from_artifact:
      - "nodes/operator/**"
      - "nodes/node-template/**"
      - "infra/catalog/operator.yaml"
      - "infra/catalog/scheduler-worker.yaml"
    artifact_only:
      - "nodes/poly/**"
